[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bahn"
version = "1.0.0"
description = "alignas: a dispatcher for Bahn's Spread challenge (Junction 2026)"
requires-python = ">=3.10"
dependencies = [
    "spread @ https://spread.bahnexpress.com/kit/spread-0.1.0-py3-none-any.whl",
    "numpy", "pandas", "scipy", "scikit-learn",
]

[project.scripts]
bahn-dispatch = "bahn.simulation.dispatch:main"

[tool.setuptools.packages.find]
where = ["src"]
